name: Validate Kerno source

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: JavaScript and Python syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate browser JavaScript
        run: |
          node --check script.js
          node --check local-agent.js
          node --input-type=module --check < novnc-client.js

      - name: Validate local service Python
        run: |
          python -m py_compile local-agent/local_agent.py
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Audit HTML structure and tutorial stages
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const ids = [...html.matchAll(/\bid="([^"]+)"/g)].map(match => match[1]);
          const duplicates = ids.filter((id, index) => ids.indexOf(id) !== index);
          if (duplicates.length) throw new Error('Duplicate HTML IDs: ' + [...new Set(duplicates)].join(', '));
          const stages = [...html.matchAll(/data-tutorial-step="(\d+)"/g)].map(match => Number(match[1]));
          if (stages.length !== 9 || stages.some((stage, index) => stage !== index)) {
            throw new Error('Tutorial must contain nine ordered stages (0–8).');
          }
          for (const id of ['welcomeScreen', 'tutorialScreen', 'appScreen', 'buildHealthChecks']) {
            if (!ids.includes(id)) throw new Error('Missing required UI element: ' + id);
          }
          console.log('HTML audit passed: ' + ids.length + ' unique IDs and nine tutorial stages.');
          NODE

      - name: Audit bilingual interface copy
        run: node tests/audit-ui-copy.cjs

      - name: Audit editor loading and diagnostics
        run: node tests/audit-editor.cjs

      - name: Install browser test runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run responsive browser smoke tests
        run: |
          python -m http.server 8000 > /tmp/kerno-http.log 2>&1 &
          echo $! > /tmp/kerno-http.pid
          node tests/smoke-browser.cjs
