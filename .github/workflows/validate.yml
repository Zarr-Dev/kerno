name: Validate Kerno source

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: JavaScript and Python syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate browser JavaScript
        run: |
          node --check script.js
          node --check local-agent.js
          node --input-type=module --check < novnc-client.js

      - name: Validate local service Python
        run: python -m py_compile local-agent/local_agent.py
